[Service]
UMask=0077
NoNewPrivileges=true
PrivateTmp=true
PrivateDevices=true
ProtectSystem=strict
ProtectHome=true
ProtectKernelTunables=true
ProtectKernelModules=true
ProtectControlGroups=true
RestrictSUIDSGID=true
RestrictRealtime=true
RestrictNamespaces=true
LockPersonality=true
RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
CapabilityBoundingSet=CAP_CHOWN CAP_DAC_OVERRIDE CAP_FOWNER CAP_NET_BIND_SERVICE
ReadWritePaths=/etc/gideon /etc/hosts /etc/systemd/system /var/lib/gideon/tls-manager /var/lib/gideon/backups/external-access /run/lock /etc/letsencrypt /var/lib/letsencrypt /var/log/letsencrypt
NoExecPaths=/var/lib/gideon /tmp /var/tmp /dev/shm
Environment=PYTHONDONTWRITEBYTECODE=1
Environment=PYTHONUNBUFFERED=1
Environment=PATH=/usr/sbin:/usr/bin:/sbin:/bin
