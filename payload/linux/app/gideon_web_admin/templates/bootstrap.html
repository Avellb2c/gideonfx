{% extends "auth_base.html" %}{% block auth %}<div class="auth-brand"><img src="{{ static_url('gideon-rx-logo.svg') }}"><div><strong>Gideon Rx Web Admin</strong><small>Configuración inicial</small></div></div><h1>Crear SuperAdmin</h1><p>Esta pantalla solo está disponible mientras no exista ningún usuario.</p>{% if error %}<div class="auth-error">{{ error }}</div>{% endif %}<form method="post" action="/bootstrap"><div class="field"><label>Usuario</label><input class="input" name="username" required value="admin"></div><div class="field"><label>Nombre visible</label><input class="input" name="display_name" required value="Administrador Gideon Rx"></div><div class="field"><label>Contraseña</label><input class="input" type="password" name="password" required></div><div class="field"><label>Confirmar</label><input class="input" type="password" name="confirm" required></div><div class="field"><label>Token de bootstrap <span class="muted">(si fue configurado)</span></label><input class="input" type="password" name="bootstrap_token"></div><button class="btn btn-primary">Crear cuenta</button></form>{% endblock %}
