{% extends "base.html" %}{% block content %}<div class="page-head"><div><h1>Cambiar contraseña</h1><p>Use una contraseña exclusiva para Gideon Rx.</p></div></div><div class="card card-pad" style="max-width:620px">{% if error %}<div class="alert danger">{{ error }}</div>{% endif %}<form method="post" action="/account/password" class="form-grid"><input type="hidden" name="csrf" value="{{ identity.csrf_token }}"><div class="field wide"><label>Contraseña actual</label><input class="input" type="password" name="current" required></div><div class="field"><label>Nueva contraseña</label><input class="input" type="password" name="new" required></div><div class="field"><label>Confirmar</label><input class="input" type="password" name="confirm" required></div><div class="wide"><button class="btn btn-primary">Actualizar contraseña</button></div></form><div class="alert"><strong>Política</strong>Mínimo 12 caracteres y al menos 3 categorías entre mayúsculas, minúsculas, números y símbolos.</div></div>{% endblock %}
