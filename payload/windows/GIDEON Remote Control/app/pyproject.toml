[project]
name = "gideon-remote-control"
version = "6.3.4-rc30"
requires-python = ">=3.11"
dependencies = [
  "openpyxl>=3.1,<4",
  "cryptography>=45,<48",
]

[project.optional-dependencies]
ui = [
  "PySide6>=6.8,<7",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.9,<1",
  "argon2-cffi>=23.1,<26",
]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unused_configs = true
show_error_codes = true
files = [
  "gideon_bootstrap.py",
  "gideon_transfer.py",
  "gideon_file_transfer_gui.py",
  "gideon_domain",
  "gideon_application",
  "gideon_infrastructure",
  "gideon_ui"
]

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["gideon_domain", "gideon_application", "gideon_infrastructure"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
