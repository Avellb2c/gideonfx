# GIDEON private ClamAV daemon. It is reachable only through this Unix socket.
Foreground true
DatabaseDirectory /var/lib/gideon/security/clamav

LocalSocket /run/gideon-clamd/clamd.sock
FixStaleSocket true
LocalSocketGroup gideonweb
LocalSocketMode 0660

LogTime true
MaxThreads 2
MaxQueue 16
MaxScanTime 120000
MaxScanSize 1024M
MaxFileSize 1024M
StreamMaxLength 1024M
ReadTimeout 300
CommandReadTimeout 30
# Signature updates restart this isolated daemon atomically. Automatic reloads
# keep two databases resident and can stall scans under memory pressure.
SelfCheck 0

ScanArchive true
ScanPE true
ScanOLE2 true
ScanPDF true
ScanHTML true
FollowDirectorySymlinks false
FollowFileSymlinks false
